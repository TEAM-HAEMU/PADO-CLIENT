# main에 올라오면 검사(타입·린트·유닛) → 실서버용 APK(친구 배포, arm64) + Play용 AAB(업로드 키 서명) 빌드 → GitHub Release에 첨부.
# PR은 검사 + 빌드만 (Release 없음). 수동 실행: Actions 탭 › Android APK › Run workflow
#
# 필요한 Secrets (Settings › Secrets and variables › Actions):
#   API_BASE_URL, KAKAO_NATIVE_APP_KEY, GOOGLE_WEB_CLIENT_ID, GOOGLE_IOS_CLIENT_ID,
#   GOOGLE_MAPS_API_KEY, GOOGLE_MAPS_ANDROID_API_KEY, AMPLITUDE_API_KEY
#   (Play AAB) ANDROID_UPLOAD_KEYSTORE_BASE64, ANDROID_UPLOAD_STORE_PASSWORD, ANDROID_UPLOAD_KEY_ALIAS, ANDROID_UPLOAD_KEY_PASSWORD
#   업로드 키 Secret이 없으면 AAB 단계는 건너뜀
name: Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check:
    name: 검사 (tsc · eslint · jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src --quiet
      - run: npx jest --ci

  apk:
    name: APK 빌드
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - run: npm ci

      - name: Android SDK 구성요소
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.1.12297006" > /dev/null

      - name: .env 만들기 (Secrets → 실서버 설정)
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
          AMPLITUDE_API_KEY: ${{ secrets.AMPLITUDE_API_KEY }}
        run: |
          {
            echo "API_BASE_URL=$API_BASE_URL"
            echo "USE_MOCK=false"
            echo "KAKAO_NATIVE_APP_KEY=$KAKAO_NATIVE_APP_KEY"
            echo "GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID"
            echo "GOOGLE_IOS_CLIENT_ID=$GOOGLE_IOS_CLIENT_ID"
            echo "GOOGLE_MAPS_API_KEY=$GOOGLE_MAPS_API_KEY"
            echo "GOOGLE_MAPS_ANDROID_API_KEY=$GOOGLE_MAPS_ANDROID_API_KEY"
            echo "AMPLITUDE_API_KEY=$AMPLITUDE_API_KEY"
          } > .env
          node scripts/sync-native-env.js

      - name: 빌드 (release · arm64)
        working-directory: android
        run: >
          ./gradlew assembleRelease --no-daemon
          -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
          -PreactNativeArchitectures=arm64-v8a
          -PpadoVersionCode=${{ github.run_number }}
          -PpadoVersionName=$VERSION_NAME

      - name: 실서버 설정인지 확인 (목 모드면 실패)
        run: grep -q 'USE_MOCK = "false"' android/app/build/generated/source/buildConfig/release/com/pado/app/BuildConfig.java

      - name: Play용 AAB (업로드 키 서명 · 전체 아키텍처)
        id: aab
        if: github.event_name != 'pull_request'
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          PADO_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          PADO_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          PADO_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "업로드 키 Secret 없음 — AAB 건너뜀"; exit 0; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export PADO_UPLOAD_STORE_FILE="$RUNNER_TEMP/upload.jks"
          ./gradlew bundleRelease --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" \
            -PpadoSigning=upload \
            -PpadoVersionCode=${{ github.run_number }} \
            -PpadoVersionName=$VERSION_NAME
          rm -f "$RUNNER_TEMP/upload.jks"
          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: 파일 이름 붙이기
        id: name
        run: |
          FILE="PADO-$VERSION_NAME-${GITHUB_SHA::7}.apk"
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/$FILE"
          if [ "${{ steps.aab.outputs.built }}" = "true" ]; then cp android/app/build/outputs/bundle/release/app-release.aab "dist/PADO-$VERSION_NAME-${GITHUB_SHA::7}.aab"; fi
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.name.outputs.file }}
          path: dist/*
          retention-days: 30

      - name: GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "main \`${GITHUB_SHA::7}\` 빌드 · 실서버 · arm64"
            echo
            git log -1 --pretty=%B
          } > notes.md
          gh release create "build-${{ github.run_number }}" dist/* \
            --target "$GITHUB_SHA" \
            --title "PADO $VERSION_NAME (${GITHUB_SHA::7})" \
            --notes-file notes.md \
            --latest
